# Copy to config.toml or ~/.config/infrawatch/config.toml.
[[http_targets]]
name = "example-app"
url = "https://app.example.com/health"

# SSH must work noninteractively; omit containers or use [] to inspect all.
[[docker_hosts]]
name = "example-server"
ssh_target = "monitor@example-server"
containers = ["example-app"]
