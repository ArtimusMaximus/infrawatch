[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "infrawatch"
version = "0.2.0"
description = "Local infrastructure and application health monitoring CLI"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.27,<1",
    "psutil>=5.9,<8",
]

[project.optional-dependencies]
dev = [
    "pytest>=8,<10",
]

[project.scripts]
infrawatch = "infra_watch.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-ra"
testpaths = ["tests"]
